name: Deploy to Netlify

on:
  workflow_dispatch: # Manual trigger only — re-enable push on June 23rd when Netlify tokens reset

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build client portal
        run: npm run build:portal

      - name: Build broker admin
        run: npm run build:admin

      - name: Deploy client portal
        run: npx -y netlify-cli@latest deploy --prod --site ${{ secrets.NETLIFY_PORTAL_SITE_ID }} --auth ${{ secrets.NETLIFY_AUTH_TOKEN }}
        working-directory: apps/client-portal

      - name: Deploy broker admin
        run: npx -y netlify-cli@latest deploy --prod --site ${{ secrets.NETLIFY_BROKER_SITE_ID }} --auth ${{ secrets.NETLIFY_AUTH_TOKEN }}
        working-directory: apps/broker-admin
